services:
  postgres:
    image: postgres:16-alpine
    container_name: klados-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: klados
      POSTGRES_PASSWORD: klados
      POSTGRES_DB: klados
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klados"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: klados-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    profiles:
      - minio
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
    container_name: klados-minio
    restart: unless-stopped
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    container_name: klados-api
    restart: unless-stopped
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: host=postgres user=klados password=klados dbname=klados port=5432 sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production-use-long-random-string
      STORAGE_DRIVER: local
      STORAGE_DIR: /data/media
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: klados-media
      MINIO_USE_SSL: "false"
      ALLOW_ORIGINS: http://localhost:3000
      ENVIRONMENT: development
    volumes:
      - media_data:/data/media
      - minio_data:/data/minio_data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    container_name: klados-web
    restart: unless-stopped
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/v1
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_URL: http://localhost:8080/v1
      INTERNAL_API_URL: http://api:8080/v1
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  media_data:
  minio_data:
