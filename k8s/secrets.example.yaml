# ==============================================================================
# Klados Secret Template (Example)
# ※ このファイルはテンプレートです。GitOps 管理下のリポジトリにはコミットせず、
#    SealedSecrets や ExternalSecrets、またはサーバー側で安全に作成してください。
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: klados-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "YOUR_POSTGRES_PASSWORD"
  DATABASE_URL: "host=klados-postgres user=klados password=YOUR_POSTGRES_PASSWORD dbname=klados port=5432 sslmode=disable"
  MINIO_ROOT_USER: "klados-admin"
  MINIO_ROOT_PASSWORD: "YOUR_MINIO_PASSWORD"
  MINIO_ACCESS_KEY: "klados-admin"
  MINIO_SECRET_KEY: "YOUR_MINIO_PASSWORD"
  JWT_SECRET: "YOUR_SECURE_RANDOM_JWT_SECRET"
  # OAuth Credentials (Optional - can also be configured via Admin Settings UI)
  GITHUB_CLIENT_ID: "YOUR_GITHUB_CLIENT_ID"
  GITHUB_CLIENT_SECRET: "YOUR_GITHUB_CLIENT_SECRET"
  DISCORD_CLIENT_ID: "YOUR_DISCORD_CLIENT_ID"
  DISCORD_CLIENT_SECRET: "YOUR_DISCORD_CLIENT_SECRET"
