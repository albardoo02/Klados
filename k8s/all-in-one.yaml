apiVersion: v1
kind: ConfigMap
metadata:
  name: klados-config
data:
  ENVIRONMENT: "production"
  PORT: "8080"
  REDIS_URL: "redis://klados-redis:6379"
  MINIO_ENDPOINT: "klados-minio:9000"
  MINIO_BUCKET: "klados-media"
  MINIO_USE_SSL: "false"
  ALLOW_ORIGINS: "*"
  INTERNAL_API_URL: "http://klados-api:8080/v1"
  ROOT_EMAIL: "admin@azisaba.net"
  ROOT_USERNAME: "admin"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: klados-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klados-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: klados-postgres
  template:
    metadata:
      labels:
        app: klados-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "klados"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: klados-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "klados"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: klados-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: klados-postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: klados-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klados-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klados-redis
  template:
    metadata:
      labels:
        app: klados-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: klados-redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: klados-redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: klados-minio-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klados-minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: klados-minio
  template:
    metadata:
      labels:
        app: klados-minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          command:
            - /bin/sh
            - -c
            - minio server /data --console-address ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: klados-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: klados-secrets
                  key: MINIO_ROOT_PASSWORD
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: klados-minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: klados-minio
spec:
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  selector:
    app: klados-minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klados-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: klados-api
  template:
    metadata:
      labels:
        app: klados-api
    spec:
      containers:
        - name: api
          image: ghcr.io/albardoo02/klados-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: klados-config
            - secretRef:
                name: klados-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: klados-api
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: klados-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klados-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: klados-web
  template:
    metadata:
      labels:
        app: klados-web
    spec:
      containers:
        - name: web
          image: ghcr.io/albardoo02/klados-web:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              find /app -name routes-manifest.json -exec sed -i 's|http://127.0.0.1:8080|http://klados-api:8080|g' {} +
              ENTRY=$(find /app -name server.js | head -n 1)
              if [ -n "$ENTRY" ]; then
                DIR=$(dirname "$ENTRY")
                mkdir -p "$DIR/.next"
                cp -rn /app/.next/static "$DIR/.next/" 2>/dev/null || true
                cp -rn /app/public "$DIR/" 2>/dev/null || true
                echo "Starting Next.js server from $DIR"
                cd "$DIR" && exec node server.js
              else
                echo "server.js not found under /app"
                exit 1
              fi
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: INTERNAL_API_URL
              value: "http://klados-api:8080/v1"
            - name: NEXT_PUBLIC_API_URL
              value: "/v1"
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: klados
spec:
  ports:
    - name: http
      port: 80
      targetPort: 3000
  selector:
    app: klados-web
---
apiVersion: v1
kind: Service
metadata:
  name: klados-web
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: klados-web
