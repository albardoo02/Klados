# ==============================================================================
# Klados (アジ鯖公式Wiki) Kubernetes Deployment Manifest (GitOps / ArgoCD Ready)
# 
# 【設計方針】
# 1. namespace のハードコードを全廃:
#    ArgoCD の destination.namespace（または kubectl apply -n <namespace>）で
#    任意のネームスペース（例: minecraft）へ一括デプロイ可能。
# 2. 機密情報の分離:
#    パスワード等の Secret はマニフェストに直接記述せず、外部管理（SealedSecrets /
#    kubectl create secret / ArgoCD Vault Plugin 等）とし、本マニフェストでは参照のみ行います。
# 3. StorageClass:
#    クラスタ環境に合わせて storageClassName: nfs-client を明示。
# 4. 安定したコンテナイメージ:
#    MinIO は Docker Hub 制限を回避するため quay.io/minio/minio:latest を使用。
# 5. Cloudflare Tunnel 対応:
#    http://klados.<namespace>.svc:80 で受けるための Service (name: klados, port: 80) を定義。
# ==============================================================================

# ------------------------------------------------------------------------------
# ConfigMap (非機密のアプリケーション設定)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: klados-config
data:
  ENVIRONMENT: "production"
  PORT: "8080"
  REDIS_URL: "redis://klados-redis:6379"
  MINIO_ENDPOINT: "klados-minio:9000"
  MINIO_BUCKET: "klados-media"
  MINIO_USE_SSL: "false"
  ALLOW_ORIGINS: "*"
  INTERNAL_API_URL: "http://klados-api:8080/v1"
  ROOT_EMAIL: "admin@azisaba.net"
  ROOT_USERNAME: "admin"
---
# ------------------------------------------------------------------------------
# PostgreSQL (データベース)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klados-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klados-postgres
  template:
    metadata:
      labels:
        app: klados-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "klados"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: klados-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "klados"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: klados-postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: klados-postgres
---
# ------------------------------------------------------------------------------
# Redis (キャッシュ & セッション)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klados-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klados-redis
  template:
    metadata:
      labels:
        app: klados-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: klados-redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: klados-redis
---
# ------------------------------------------------------------------------------
# MinIO (画像・添付メディアストレージ)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klados-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klados-minio
  template:
    metadata:
      labels:
        app: klados-minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          command:
            - /bin/sh
            - -c
            - minio server /data --console-address ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: klados-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: klados-secrets
                  key: MINIO_ROOT_PASSWORD
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: klados-minio
spec:
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  selector:
    app: klados-minio
---
# ------------------------------------------------------------------------------
# Backend API (Go / Gin / GORM)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klados-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: klados-api
  template:
    metadata:
      labels:
        app: klados-api
    spec:
      containers:
        - name: api
          image: ghcr.io/albardoo02/klados-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: klados-config
            - secretRef:
                name: klados-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: klados-api
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: klados-api
---
# ------------------------------------------------------------------------------
# Frontend Web (Next.js / SSR / UI)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klados-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: klados-web
  template:
    metadata:
      labels:
        app: klados-web
    spec:
      containers:
        - name: web
          image: ghcr.io/albardoo02/klados-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: INTERNAL_API_URL
              value: "http://klados-api:8080/v1"
            - name: NEXT_PUBLIC_API_URL
              value: "/v1"
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
# Cloudflare Tunnel受信用 Service (http://klados.<namespace>.svc:80)
apiVersion: v1
kind: Service
metadata:
  name: klados
spec:
  ports:
    - name: http
      port: 80
      targetPort: 3000
  selector:
    app: klados-web
---
# 標準Web Service
apiVersion: v1
kind: Service
metadata:
  name: klados-web
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: klados-web
