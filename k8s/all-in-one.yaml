apiVersion: v1
kind: ConfigMap
metadata:
  name: klados-config
data:
  ENVIRONMENT: "production"
  PORT: "8080"
  REDIS_URL: "redis://klados-redis:6379"
  STORAGE_DRIVER: "local"
  STORAGE_DIR: "/data/media"
  ALLOW_ORIGINS: "*"
  INTERNAL_API_URL: "http://klados-api:8080/v1"
  MAIN_DOMAIN: "cms.azisaba.net"
  ROOT_EMAIL: "admin@azisaba.net"
  ROOT_USERNAME: "admin"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: klados-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klados-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: klados-postgres
  template:
    metadata:
      labels:
        app: klados-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "klados"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: klados-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "klados"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: klados-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: klados-postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: klados-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klados-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klados-redis
  template:
    metadata:
      labels:
        app: klados-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: klados-redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: klados-redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: klados-minio-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klados-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: klados-api
  template:
    metadata:
      labels:
        app: klados-api
    spec:
      containers:
        - name: api
          image: ghcr.io/albardoo02/klados-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: klados-config
            - secretRef:
                name: klados-secrets
          volumeMounts:
            - name: media-data
              mountPath: /data/media
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: media-data
          persistentVolumeClaim:
            claimName: klados-minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: klados-api
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: klados-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klados-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: klados-web
  template:
    metadata:
      labels:
        app: klados-web
    spec:
      containers:
        - name: web
          image: ghcr.io/albardoo02/klados-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: INTERNAL_API_URL
              value: "http://klados-api:8080/v1"
            - name: NEXT_PUBLIC_API_URL
              value: "/v1"
            - name: MAIN_DOMAIN
              value: "cms.azisaba.net"
            - name: NEXT_PUBLIC_MAIN_DOMAIN
              value: "cms.azisaba.net"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
              httpHeaders:
                - name: Host
                  value: cms.azisaba.net
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
              httpHeaders:
                - name: Host
                  value: cms.azisaba.net
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: klados
spec:
  ports:
    - name: http
      port: 80
      targetPort: 3000
  selector:
    app: klados-web
---
apiVersion: v1
kind: Service
metadata:
  name: klados-web
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: klados-web
